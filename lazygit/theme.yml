# Default+ theme for lazygit
#
# Generated by bin/build.py from palette.yaml — do not edit by hand.
# This is only the `theme:` block. Merge it under `gui:` in your own
# ~/.config/lazygit/config.yml — lazygit cannot import a separate theme file.
#
# lazygit has no upstream Default+ extra, so every slot below is assigned from
# the semantic roles in palette.yaml.
gui:
  theme:
    activeBorderColor:
      - '#35B0D8'
      - bold
    inactiveBorderColor:
      - '#4C4C4C'
    searchingActiveBorderColor:
      - '#FFE76D'
      - bold
    optionsTextColor:
      - '#35B0D8'
    selectedLineBgColor:
      - '#515B70'
    inactiveViewSelectedLineBgColor:
      - '#242424'
    cherryPickedCommitFgColor:
      - '#FFE76D'
    cherryPickedCommitBgColor:
      - '#242424'
    markedBaseCommitFgColor:
      - '#171717'
    markedBaseCommitBgColor:
      - '#FFE76D'
    unstagedChangesColor:
      - '#FC4651'
    defaultFgColor:
      - '#FFFFFF'
  authorColors:
    '*': '#8E8E8E'
