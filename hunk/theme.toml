# Default+ theme for hunk
#
# This is the `custom_theme` block only. Merge it into your own
# ~/.config/hunk/config.toml — hunk cannot import a separate theme file.
#
# Colours come from palette.yaml; `bin/build.py --validate` checks them.
# Syntax scopes follow Xcode's own role assignment, which is NOT the usual
# terminal convention: in Default+ comments are GREEN and strings are RED.

theme = "custom"

[custom_theme]
base  = "dark-plus"
label = "Default+"

# UI shell
background  = "#171717"
panel       = "#111111"
panelAlt    = "#242424"
border      = "#4C4C4C"
accent      = "#35B0D8"
accentMuted = "#266478"
text        = "#FFFFFF"
muted       = "#8E8E8E"

# Diff row backgrounds
addedBg        = "#1C3425"
removedBg      = "#452023"
movedAddedBg   = "#1D363E"
movedRemovedBg = "#352645"
contextBg      = "#171717"

# Word-level (intra-line) highlights
addedContentBg   = "#1F4A2F"
removedContentBg = "#67272B"
contextContentBg = "#2F2F2F"

# Gutter
lineNumberBg     = "#111111"
lineNumberFg     = "#4C4C4C"
addedSignColor   = "#226039"
removedSignColor = "#8A2E34"

# Selection
selectedHunk = "#515B70"

# File status badges
badgeAdded   = "#226039"
badgeRemoved = "#8A2E34"
badgeNeutral = "#8E8E8E"

fileNew       = "#226039"
fileDeleted   = "#8A2E34"
fileRenamed   = "#35B0D8"
fileModified  = "#7C5A3E"
fileUntracked = "#8E8E8E"

# Agent notes
noteBorder          = "#35B0D8"
noteBackground      = "#111111"
noteTitleBackground = "#1D363E"
noteTitleText       = "#FFFFFF"

[custom_theme.syntax_scopes]
# Comments  ->  GREEN (xcode.syntax.comment) — the Default+ signature
"comment"                        = "#2EA85B"
"punctuation.definition.comment" = "#2EA85B"

# Strings  ->  RED (xcode.syntax.string)
"string"                        = "#FC4651"
"string.quoted"                 = "#FC4651"
"punctuation.definition.string" = "#FC4651"

# Keywords / storage  ->  magenta (xcode.syntax.keyword)
"keyword"          = "#F2248C"
"keyword.control"  = "#F2248C"
"storage"          = "#F2248C"
"storage.type"     = "#F2248C"

# Operators  ->  plain (Xcode leaves operators in the foreground colour)
"keyword.operator" = "#FFFFFF"

# Project identifiers: types, classes and functions you define  ->  teal
"entity.name.function" = "#56D0B3"
"entity.name.type"     = "#56D0B3"
"entity.name.class"    = "#56D0B3"
"meta.function-call"   = "#56D0B3"
"variable"             = "#56D0B3"
"variable.other"       = "#56D0B3"

# System identifiers: SDK members and types  ->  purple
"support.function" = "#AB64FF"
"support.type"     = "#D0A8FF"
"support.class"    = "#D0A8FF"

# Numbers / constants  ->  yellow (xcode.syntax.number)
"constant.numeric"  = "#FFE76D"
"constant.language" = "#FFE76D"
"constant.other"    = "#FFE76D"

# Preprocessor / macros  ->  orange (xcode.syntax.preprocessor)
"meta.preprocessor"      = "#FD8F3F"
"keyword.control.import" = "#FD8F3F"
"keyword.other.using"    = "#FD8F3F"

# Attributes  ->  tan (xcode.syntax.attribute)
"entity.other.attribute-name" = "#E09D65"

# Tags  ->  cyan (xcode.syntax.declaration.other)
"entity.name.tag"            = "#35B0D8"
"punctuation.definition.tag" = "#8E8E8E"

# Punctuation  ->  muted
"punctuation"           = "#8E8E8E"
"punctuation.separator" = "#8E8E8E"

# Diff markup  ->  muted green/red, matching the row background tone
"markup.inserted" = "#226039"
"markup.deleted"  = "#8A2E34"
"markup.changed"  = "#35B0D8"
