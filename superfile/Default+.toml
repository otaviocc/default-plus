##############################################
#                                            #
#              Default+ Theme               #
#                                            #
##############################################

# Ported from the Default+ Xcode theme / colorscheme.
# See: https://github.com/otaviocc/default-plus

# This contains the theme config file for superfile! For more details see:
# https://superfile.dev/configure/custom-theme/

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "monokai"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#FFFFFF"
full_screen_bg = "#1E1E1E"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#35B0D8", "#F2248C"]

#-- File Panel
file_panel_fg = "#FFFFFF"
file_panel_bg = "#1E1E1E"
file_panel_border = "#4D4D4D"
file_panel_border_active = "#56D0B3"
file_panel_top_directory_icon = "#35B0D8"
file_panel_top_path = "#56D0B3"
file_panel_item_selected_fg = "#F2248C"
file_panel_item_selected_bg = "#54554A"

#-- Footer
footer_fg = "#FFFFFF"
footer_bg = "#1E1E1E"
footer_border = "#4D4D4D"
footer_border_active = "#56D0B3"

#-- Sidebar
sidebar_fg = "#FFFFFF"
sidebar_bg = "#1E1E1E"
sidebar_title = "#F2248C"
sidebar_border = "#4D4D4D"
sidebar_border_active = "#56D0B3"
sidebar_item_selected_fg = "#F2248C"
sidebar_item_selected_bg = "#54554A"
sidebar_divider = "#4D4D4D"

#-- Modals
modal_fg = "#FFFFFF"
modal_bg = "#181818"
modal_border_active = "#56D0B3"
modal_cancel_fg = "#FFFFFF"
modal_cancel_bg = "#2A2A2A"
modal_confirm_fg = "#FFFFFF"
modal_confirm_bg = "#2EA85B"

#-- Help Menu
help_menu_hotkey = "#FFE76D"
help_menu_title = "#F2248C"

#-- Special
cursor = "#FFFFFF"
correct = "#2EA85B"
error = "#FC4651"
hint = "#56D0B3"
cancel = "#4D4D4D"
