# Default+
#
# Canonical color palette for the Default+ colorscheme.
# Originated as an Xcode Font & Color Theme, ported to every app below.
# All per-app files in this repo are derived from these values — if you
# change a color, change it here first and propagate it to the ports.

meta:
  name: Default+
  appearance: dark
  origin: Xcode Font & Color Theme (Default+.xccolortheme)

base:
  background: "#1E1E1E"
  foreground: "#FFFFFF"
  cursor: "#FFFFFF"
  selection_background: "#54554A"
  selection_foreground: "#FFFFFF"
  muted: "#4D4D4D"        # ANSI black / comments-adjacent UI chrome
  muted_text: "#8E8E8E"   # secondary text, used in TUI ports (opencode, nvim)
  subtle: "#2A2A2A"       # subtle panel/background differentiation
  panel_background: "#181818"

# Core accents. These are the 6 "hero" colors used consistently across
# every port (Xcode syntax, ANSI 1-6/9-14, TUI accents, etc).
accent:
  red: "#FC4651"      # Xcode: string / regex
  green: "#2EA85B"    # Xcode: comment
  yellow: "#FFE76D"   # Xcode: number / character
  blue: "#35B0D8"      # Xcode: declaration.other
  magenta: "#F2248C"   # Xcode: keyword
  cyan: "#56D0B3"      # Xcode: type / class / function

# ANSI 16-color terminal palette (0-7 and bright 8-15).
# Default+ does not differentiate normal/bright — both halves are identical.
ansi:
  black: "#4D4D4D"
  red: "#FC4651"
  green: "#2EA85B"
  yellow: "#FFE76D"
  blue: "#35B0D8"
  magenta: "#F2248C"
  cyan: "#56D0B3"
  white: "#FFFFFF"
  bright_black: "#4D4D4D"
  bright_red: "#FC4651"
  bright_green: "#2EA85B"
  bright_yellow: "#FFE76D"
  bright_blue: "#35B0D8"
  bright_magenta: "#F2248C"
  bright_cyan: "#56D0B3"
  bright_white: "#FFFFFF"

# Extended accents that only exist in the original Xcode theme (used for
# finer-grained syntax highlighting there). Not currently mirrored in the
# terminal/TUI ports, documented here for completeness and future ports.
xcode_extended:
  attribute: "#E09D65"          # xcode.syntax.attribute
  macro_preprocessor: "#FD8F3F" # xcode.syntax.macro / preprocessor
  url: "#4FA5FF"                # xcode.syntax.url
  type_system: "#D0A8FF"        # xcode.syntax.identifier.*.system (types)
  function_system: "#AB64FF"    # xcode.syntax.identifier.function.system
  declaration_type: "#66DAFF"   # xcode.syntax.declaration.type

# herdr's [theme.custom] schema requires a few tokens that don't have a
# direct equivalent in the core/base palette above (a surface tone scale,
# a secondary text tone, and a "peach" accent used for its own UI). Kept
# here so the herdr port stays reproducible from this file.
herdr_extended:
  surface0: "#242424"     # slightly raised panel surface
  surface1: "#2E2E2E"     # further raised panel surface
  surface_dim: "#141414"  # dimmed/recessed surface
  subtext0: "#B3B3B3"     # secondary text, lighter than base.muted_text
  peach: "#FD9660"        # herdr-specific accent (no equivalent elsewhere)
